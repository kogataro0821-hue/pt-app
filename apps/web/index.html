<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover: iPhone のノッチ／ホームバーの領域まで背景を広げるための指定。
      文字がその下に隠れないよう、CSS 側で safe-area-inset を使って余白を確保しています。
      user-scalable=no は入れません（拡大できないと読みづらい人が困るため）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>PT Manager</title>
    <meta name="description" content="食事・運動・体重を記録して、PFCを正確に管理するアプリ" />

    <!-- ホーム画面に追加したときの見え方（iOS） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PT Manager" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Safari 上部のバーの色を、ライト／ダークそれぞれの背景に合わせる -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1312" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      会員証のランク名に使う筆記体（追加仕様: 会員ランク）。

      ★ 読み込めなくても壊れません。
        CSS 側で 'Snell Roundhand'（iOS）→ 'Apple Chancery' → cursive と
        フォールバックを並べてあるので、オフラインでも筆記体で出ます。
        ランク名は英字7語だけなので、日本語の表示には一切影響しません。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
